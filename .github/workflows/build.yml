name: Compilar aplicación Windows

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Preparar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publicar ejecutable portable
        shell: pwsh
        run: ./build.ps1
      - name: Guardar ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: Edge510-OPNsense-Installer-win-x64
          path: |
            release/Edge510-OPNsense-Installer.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
